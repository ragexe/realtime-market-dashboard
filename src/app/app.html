<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <div class="brand">Market Dashboard</div>
    
    <nav>
      <mat-nav-list>
        <a 
          mat-list-item 
          routerLink="/dashboard"
          routerLinkActive 
          #dashboardRla="routerLinkActive"
          [activated]="dashboardRla.isActive"
        >Dashboard</a>

        <a 
          mat-list-item 
          routerLink="/settings"
          routerLinkActive 
          #settingsRla="routerLinkActive"
          [activated]="settingsRla.isActive"
        >Settings</a>
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (pageTitle(); as pageTitle) {
      <mat-toolbar>{{ pageTitle }}</mat-toolbar>
    }
    
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
